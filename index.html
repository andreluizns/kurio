<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta name="description" content="Kurio — marketplace de NFTs selecionados de criadores emergentes e consagrados. Colecione arte digital rara e verificada." />
    <title>Kurio — Marketplace de NFTs</title>
    <link rel="preload" href="/fonts/roboto-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/roboto-mono-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Arte do destaque inicial (elemento de LCP da página inicial). -->
    <link rel="preload" as="image" href="/nfts/emerald-640.webp" imagesrcset="/nfts/emerald-320.webp 320w, /nfts/emerald-640.webp 640w" imagesizes="(max-width: 767px) 138px, 450px" fetchpriority="high" />
  </head>
  <body style="margin: 0; background: #140d0a">
    <div id="root">
      <!-- Shell estático exibido até o React assumir (primeiro paint sem depender do JavaScript). -->
      <div style="min-height: 100dvh; padding: 32px 24px; background: #140d0a">
        <span style="font: 700 14px/18px 'Roboto Mono', ui-monospace, monospace; letter-spacing: 0.1em; color: #f5f1eb">KURIO</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
